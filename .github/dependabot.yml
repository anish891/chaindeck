version: 2
updates:
  # npm: one grouped PR for minor and patch updates each week; major versions arrive as separate PRs to review on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
