name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Known-vulnerable runtime dependencies fail the build (the vendored browser libraries are pinned by hash in
      # api/verify-security.js and are not covered by npm audit).
      - run: npm audit --omit=dev --audit-level=high
