name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Third-party actions are pinned to a commit SHA (the tag in the comment); to upgrade, change both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps never push, so do not leave the token in .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The paper app is built from paper-app/ and the output is committed; fail if it is stale.
      - run: npm run build:paper
      - run: git diff --exit-code -- public/paper && test -z "$(git ls-files --others --exclude-standard public/paper)"
      # Known-vulnerable runtime dependencies fail the build (the vendored browser libraries are pinned by hash in
      # test/verify-security.js and are not covered by npm audit).
      - run: npm audit --omit=dev --audit-level=high
