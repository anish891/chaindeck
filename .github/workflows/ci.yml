name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The paper app is built from paper-app/ and the output is committed; fail if it is stale.
      - run: npm run build:paper
      - run: git diff --exit-code -- public/paper && test -z "$(git ls-files --others --exclude-standard public/paper)"
      # Known-vulnerable runtime dependencies fail the build (the vendored browser libraries are pinned by hash in
      # api/verify-security.js and are not covered by npm audit).
      - run: npm audit --omit=dev --audit-level=high
